[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-city-edge-agent"
version = "0.1.0"
description = "Event-driven smart-city edge reasoning for Qualcomm QIDK"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
data = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "torch>=2.3",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

