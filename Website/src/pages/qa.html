<section class="section qa-sit" data-slot="sits" hidden>
  <span class="label" data-topic="situations">Situations</span>
  <p class="statement">What happens when…?</p>
  <div class="sit-picker" role="group" aria-label="Pick a situation" data-slot="sitpick"></div>
  <div class="grid" data-slot="sitcard"></div>
</section>

<section class="section qa-uc" data-slot="usecase" hidden>
  <span class="label" data-topic="use_case">Use case</span>
  <p class="statement" data-slot="ucstatement">What this is for.</p>
  <div data-slot="ucanchors"></div>
  <div class="grid qa-uc__grid" data-slot="ucgrid"></div>
  <ol class="qa-list" data-slot="uclist"></ol>
</section>

<section class="section qa-head">
  <span class="label">Q&amp;A</span>
  <p class="statement">Ask anything. Each answer is a chart.</p>
  <p class="lead muted" data-slot="count">Type a question or pick a topic.</p>
  <div class="qa-search">
    <label class="label" for="qa-q">Search the questions</label>
    <input id="qa-q" type="search" autocomplete="off" spellcheck="false" placeholder="e.g. why not GPU">
  </div>
  <div class="qa-chips" role="group" aria-label="Topics" data-slot="chips"></div>
</section>

<section class="section qa-list-wrap">
  <span class="label" data-slot="listlabel">Likely first questions</span>
  <ol class="qa-list" data-slot="list"></ol>
  <p class="muted qa-empty" data-slot="empty" hidden>No question matches. Try fewer words, or pick a topic.</p>
  <button type="button" class="btn qa-more" data-slot="more">Show all questions</button>
</section>

<section class="section">
  <div class="grid" data-slot="side"></div>
</section>

<section class="section qa-end">
  <span class="label">In short</span>
  <div data-slot="peak"></div>
  <p class="qa-back"><a class="btn btn--solid" href="#/deck">← Back to Deck</a></p>
</section>
<div data-slot="next"></div>
